<!-- templates/registration/login.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY PLANNER! АВТОРИЗАЦИЯ</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>
    <header class="container">
        <a class="logo">My Planner!</a>
    </header>
    {% load widget_tweaks %}
    <div class="wrapper1">
        <div class="container1">
            <h1>Вход</h1>
            <form method="post" class="login-form">
                {% csrf_token %}
                <div class="form-group">
                    {{ form.username|add_class:"form-control" }}
                </div>
                <div class="form-group">
                {{ form.password|add_class:"form-control" }}
                </div>
                <button type="submit" class="log">Войти</button>
            </form>
            <!-- Добавляем кнопку для перехода на страницу регистрации -->
     <a href="{% url 'register' %}"><button class="reg">Зарегистрироваться</button></a>
        </div>
    </div>

    
</html>
